<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Las Vegas Designs USA</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preload" href="/lvd-logo.png" as="image" />
    <link rel="preload" href="/lvd-logo-full.png" as="image" />
    <link rel="preload" href="/fonts/tabler-icons.woff" as="font" type="font/woff" crossorigin />
    <link rel="stylesheet" href="/tabler-icons.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <style>
      html,body{margin:0;background:#fff;color-scheme:light}
      #root{min-height:100vh;background:#fff}
      .boot-loader{
        min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        background:#fff;color:#222
      }
      .boot-loader img{width:48px;height:48px;object-fit:contain;border-radius:50%}
      .boot-spinner{
        width:22px;height:22px;border:2px solid rgba(34,34,34,.12);border-top-color:#222;
        border-radius:50%;animation:boot-spin .7s linear infinite
      }
      @keyframes boot-spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Loading">
        <img src="/lvd-logo.png" alt="" />
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
